title = "Kart reset action (the start pose is done)"
description = """
The design document's Runtime Tuning and Player Actions feature specifies Reset Kart: return to X=0 Z=0 facing +Z with zero velocity, leaving the timer, best time and world untouched. add-kart-view-orientation-and-input closed the START POSE half — the kart is placed at the origin facing +Z with zero velocity, verified by tests/kart_test.gd and tools/check_kart_conformance.py — and bound R in project.godot's InputMap, pinned by check_settings.py. What remains is the ACTION: pressing R does nothing. Belongs to M7 with the rest of the player actions.

WHY IT IS NOW CONCRETE (add-aabb-collision-response, M3). Reset Kart is the design document's NAMED escape from the pinned case: a kart between two props at minPropSeparation overlaps both, only the first in registration order is resolved, and the push out of one drives it into the other. godot/tests/collision_test.gd sweeps that pair at sixteen headings and tools/collision_capture.sh captures it (godot/docs/progress/2026-08-29-m3-collision-pin.png). The document explicitly forbids fixing it in the collision response — the placement rule is the root cause — so this action is the only remedy the specification offers.

Scope note: the pin is NOT permanent (ambiguity A12, att 20). Held ticks measured at 125 and 127 driving along the pair's axis and 15-20 at the other fourteen headings, so this is a quality-of-life action rather than the only way out of a dead end. That does not change what Reset Kart must do."""
status = "not-started"
