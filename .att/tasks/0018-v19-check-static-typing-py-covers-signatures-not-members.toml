id = 18
title = "V19: check_static_typing.py covers signatures, not members"
description = """
CONSTRAINTS §10 Verification criteria V19 requires that every GDScript function signature carry parameter and return types AND that members be typed. tools/check_static_typing.py checks signatures only; the criterion is marked with a warning in three places (CONSTRAINTS §3 Language and style, the V19 row, and the gate table) and no tracker item owns closing it.

Found in passing during add-aabb-collision-response (M3), which added scripts/core/collision.gd and tests/collision_test.gd: every member in both is typed, but nothing would have failed if they were not. gdlint ships no typing rules, so this is an extension to the existing Python checker — parse 'var NAME' declarations at class scope and require ': Type' or ':=' with an inferable initialiser.

Exit criteria: the checker rejects an untyped member; the rejection is demonstrated by deliberately untyping one; the three warning marks in CONSTRAINTS become green."""
status = "not-started"
