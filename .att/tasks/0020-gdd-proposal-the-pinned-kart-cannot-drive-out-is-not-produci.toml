title = "GDD proposal: the pinned kart 'cannot drive out' is not producible by the specified response"
description = """
Raised by add-aabb-collision-response (M3). Ambiguity A12, filed Open.

The design document's Collision Detection and Response feature, under 'Not becoming trapped inside an obstacle', states that a kart between two props at minPropSeparation 'oscillates in place with its velocity zeroed every tick and cannot drive out'. The response the same feature specifies — a push along the horizontal unit vector from the prop's volume centre to the kart's position — cannot produce that state. The push is radial, so any transverse offset is multiplied by roughly pushDistance/separation on every push and the centred state is an unstable equilibrium.

Measured in godot/tests/collision_test.gd over the 16 headings the rest of that suite uses: the pin lasts 125 and 127 ticks at the two headings driving along the pair's axis, and 15-20 ticks at the other fourteen. Against the shipped cottages (tools/collision_capture.sh pin) the kart is still held at 60 ticks and free by 90.

What survives and is asserted: driving along the pair's axis never carries the kart past it, and the pin ends transversely at every heading.

This is a defect in the document rather than a gap in it, so per the drift table in CONSTRAINTS §12 Review it belongs in the GDD by proposal rather than being resolved in a port's delta spec. Proposed amendment: replace 'cannot drive out' with a statement of what the response actually guarantees — the kart is stopped dead on every tick of contact and cannot pass between the pair — and note that the centred state is unstable, so the kart is ejected transversely after a fraction of a second to a couple of seconds depending on heading. Reset Kart remains the named escape and the placement rule remains the named remedy; NEITHER changes.

Exit criteria: the GDD sentence is amended or the finding is explicitly rejected with reasoning; A12 moves above the line in godot/docs/AMBIGUITIES.md; the delta spec, CONSTRAINTS §4 Architectural boundaries and ROADMAP M3 are re-checked against whichever way it goes."""
