title = "Record: two CI backlog tasks were deleted when CI was dropped"
description = "Audit trail. When CI was dropped during add-godot-project-foundations, two backlog tasks were deleted rather than closed: 'decide whether CI caches the Godot binary and venv' and 'verify the CI workflow end to end on a real push'. Both were void - there is no CI to cache for or verify. Recorded because CONSTRAINTS §11 Work tracking says nothing leaves scope untracked, and a deleted task leaves an unexplained gap in the ID sequence. Note the vacated IDs were reused by later tasks; this entry is the explanation for that gap."
